<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Registration Closed | Arduino Day PH 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .method-info { display: none; margin-top: 10px; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
        
        .amount-badge {
            display: inline-block;
            background: #f1f5f9;
            color: #64748b;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            margin-top: 5px;
        }

        option:disabled {
            color: #94a3b8;
            background-color: #f8fafc;
        }

        #deadlineNotice {
            display: block; /* Forced to show as requested */
            background: #fee2e2;
            color: #b91c1c;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
            border: 2px solid #ef4444;
        }

        .check-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 10px;
            color: #475569;
        }
        .checkmark {
            height: 18px;
            width: 18px;
            background-color: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            border-radius: 4px;
            margin-right: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <h2 id="statusTitle" style="margin-top: 20px; font-weight: 800;">Processing...</h2>
        <p id="statusMsg">Please wait.</p>
    </div>

    <div class="glass-card">
        <div id="deadlineNotice">
            REGISTRATION OFFICIALLY CLOSED<br>
            All workshop slots for Arduino Day Philippines 2026 are now closed.
        </div>

        <div class="header" style="opacity: 0.6;">
            <div class="logo-container">
                <img src="ITECH LOGO.png" alt="ITECH Logo" class="site-logo">
            </div>
            <h2 style="font-weight: 800;">EVENT REGISTRATION FORM</h2>
            <p>Arduino Day Philippines 2026 | iTECHLAB</p>
        </div>

        <form id="regForm" style="pointer-events: none; opacity: 0.6;">
            <div class="form-section">
                <div class="section-title">SECTION 1: PERSONAL INFORMATION</div>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Registration Closed" disabled>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">SECTION 3: WORKSHOP SELECTION</div>
                <div class="input-group">
                    <label>Step 1: Choose Event Date</label>
                    <select id="dateSelect" required>
                        <option value="" disabled selected>Select Date</option>
                        <option value="mar14">March 14, 2026</option>
                        <option value="mar15">March 15, 2026</option>
                    </select>
                </div>

                <div class="input-group" id="workshopWrapper" style="display: none;">
                    <label>Step 2: Select Workshop</label>
                    <select name="workshop" id="workshopSelect" disabled>
                        <option value="" disabled selected>All Workshops Closed</option>
                        <option value="Drone Workshop" class="mar14" disabled>Morning: Drone Education Workshop (CLOSED)</option>
                        <option value="Arduino Q" class="mar14" disabled>Morning: Arduino Q Workshop (CLOSED)</option>
                        <option value="VR Workshop" class="mar14" disabled>Afternoon: VR Workshop (CLOSED)</option>
                        <option value="Bambu Workshop" class="mar14" disabled>Afternoon: 3D Printing Innovation Workshop (CLOSED)</option>
                        <option value="Arduino Beginner" class="mar15" disabled>Morning: Arduino Beginner Workshop (CLOSED)</option>
                        <option value="Arduino Advance" class="mar15" disabled>Afternoon: Arduino Advanced Workshop (CLOSED)</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn" style="background: #94a3b8; cursor: not-allowed;">Registration Closed</button>
        </form>
    </div>

    <script>
        const dateSelect = document.getElementById('dateSelect');
        const workshopWrapper = document.getElementById('workshopWrapper');
        const workshopSelect = document.getElementById('workshopSelect');
        const allOptions = Array.from(workshopSelect.options);

        // Force all options to stay disabled even if date is changed
        dateSelect.addEventListener('change', function() {
            workshopWrapper.style.display = 'block';
            workshopSelect.innerHTML = '<option value="" disabled selected>All Workshops Closed</option>';
            
            allOptions.forEach(option => {
                if (option.classList.contains(this.value)) {
                    const newOption = option.cloneNode(true);
                    newOption.disabled = true;
                    workshopSelect.appendChild(newOption);
                }
            });
        });
    </script>
</body>
</html>
